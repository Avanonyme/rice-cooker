# rice-cooker catalog: one file keyed by rice name.
# Filename stem of each [table] is the CLI id: `rice-cooker install <stem>`.
#
# `commit` is any Git ref accepted by `git checkout --detach`:
# branch name (e.g. `commit = "stable"`), tag, full SHA, or short SHA.
#
# You can submit a rice by adding it to the catalog & opening a PR, and/or submitting this form: 
# Rice cooker v0.1 only applies quickshell configs & installs dependencies.
# Preview dependencies are any dependencies that aren't in rice-cooker that the rice would fail to preview without.
# We recommend packaging your rice with nix flakes. Rice cooker will be updated to support them soon.

[noctalia]
display_name = "Noctalia"
creator_name = "noctalia-dev"
repo = "https://github.com/noctalia-dev/noctalia-shell"
commit = "3e159ec301f8916e3bfd17c178258fa030f40e39"
symlink_src = "."
symlink_dst = "~/.config/quickshell/noctalia"
compositors = ["hyprland", "niri"]
# v5 is C++ and renders its own layer surfaces, so it never uses the quickshell
# namespace: `^noctalia-` is the only plausible prefix, and it matches the
# `^noctalia-overview*` layer rule noctalia's own niri docs require. Still worth
# one `niri msg layers` confirmation.
layer_namespaces = ["^noctalia-"]
install_deps = [
  "noctalia-shell",
  "cliphist",
  "wlsunset",
  "power-profiles-daemon",
  "ddcutil",
  "wl-clipboard",
  "wtype"
]
# `noctalia-qs` was the quickshell fork v4 ran on. v5 has no quickshell at all,
# so installing it for a preview was pulling an obsolete shell.
preview_deps = []

# Nix side. noctalia's flake exposes `homeModules.default` and its own
# `programs.noctalia`, so it is a `module` rice — and since v5 that flake has
# only one input, `nixpkgs`: no quickshell, no QML. Its Arch side (the symlink
# above) is independent of this and still applies there.
[noctalia.launch]
kind = "argv"
argv = ["noctalia"]

[noctalia.nix]
# v5 is C++ and must be built; it also has a Home Manager module. Both are true at
# once, which is why `build` and `module` are separate fields.
build = "default"
module = "homeModules.default"
hm_option = "programs.noctalia.enable"
flake = "github:noctalia-dev/noctalia-shell/3e159ec301f8916e3bfd17c178258fa030f40e39"

[linux-retroism]
display_name = "linux-retroism"
creator_name = "diinki"
repo = "https://github.com/diinki/linux-retroism"
commit = "255eb6a7b5a0d26413eea8dc5f47e8d67bb4b1ff"
symlink_src = "configs/quickshell"
symlink_dst = "~/.config/quickshell/linux-retroism"

[dms]
display_name = "DankMaterialShell"
creator_name = "AvengeMedia"
repo = "https://github.com/AvengeMedia/DankMaterialShell"
commit = "c6ed64b24e414cd4b9588b645a6345b15fa697f4"
symlink_src = "quickshell"
symlink_dst = "~/.config/quickshell/dms"

[zephyr]
display_name = "Zephyr"
creator_name = "flickowoa"
repo = "https://github.com/flickowoa/dotfiles"
commit = "92a33e776a844070bab67cd4a4a1a688b3ea6730"
symlink_src = "quickshell"
symlink_dst = "~/.config/quickshell/zephyr"

[caelestia]
display_name = "Caelestia"
creator_name = "soramenew"
repo = "https://github.com/caelestia-dots/shell"
commit = "stable"
symlink_src = "."
symlink_dst = "~/.config/quickshell/caelestia"
package_managed = true
preview_deps = ["quickshell-git", "caelestia-shell"]

[whisker]
display_name = "whisker"
creator_name = "corecathx"
repo = "https://github.com/corecathx/whisker"
commit = "ab1edb84b7b8cf1c0514d12f1c639f8c863e3900"
symlink_src = "."
symlink_dst = "~/.config/quickshell/whisker"
install_deps = [
  "cliphist",
  "wl-clipboard",
  "ffmpeg",
  "gpu-screen-recorder",
  "pipewire",
  "whisker-shell-git"
]
preview_deps = ["ttf-material-symbols-variable", "ttf-outfit"]

[ryu-shell]
display_name = "Ryu Shell"
creator_name = "RyuZinOh"
repo = "https://github.com/RyuZinOh/.dotfiles"
commit = "9380b0232e69a847459c35d0e7c417dead0cb3be"
symlink_src = "quickshell"
symlink_dst = "~/.config/quickshell/ryu-shell"
preview_deps = ["ttf-cascadia-code-nerd", "noto-fonts-cjk"]

[nandoroid]
display_name = "Nandoroid"
creator_name = "na-ive"
repo = "https://github.com/na-ive/nandoroid-shell"
commit = "c24bda36581fe7a34c692f2798a9296dcfca6f93"
symlink_src = "dotfiles/.config/quickshell/nandoroid"
symlink_dst = "~/.config/quickshell/nandoroid"
preview_deps = ["ttf-material-symbols-variable"]

# ── nix rices ─────────────────────────────────────────────────────────────────
# `commit` must be a full 40-character revision here: a short SHA resolves
# non-deterministically as the log grows, and the validator rejects it.
# `[nix]` decides how the rice is realized; `[launch]` how it is started and
# verified.

[niri-caelestia]
display_name = "Niri Caelestia"
creator_name = "jutraim"
repo = "https://github.com/jutraim/niri-caelestia-shell"
commit = "fe36491a77c56ac51d6cad1c6fc05f9828fad837"
compositors = ["niri"]
# Measured on a live niri session: the shell names every surface
# `caelestia-<name>` (background, drawers, border-exclusion).
layer_namespaces = ["^caelestia-"]

[niri-caelestia.launch]
kind = "argv"
argv = ["caelestia-shell"]

[niri-caelestia.nix]
build = "default"
# Its flake exposes homeManagerModules.default, and its config is delivered as
# `xdg.configFile."caelestia/shell.json"` from the module's own settings — it has
# no dotfiles tree, verified at both the pinned rev and main.
module = "homeModules.default"
flake = "github:jutraim/niri-caelestia-shell/fe36491a77c56ac51d6cad1c6fc05f9828fad837"
# So `programs.rice-cooker` can verify the user imported the rice's module.
hm_option = "programs.caelestia.enable"
